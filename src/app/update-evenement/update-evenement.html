
<div class="container">
  <h2>Modifier un événement :</h2>

  <form>
   
<div class="col-sm-2 col-md-2 col-lg-2">
  <label>ID Événement</label>
  <input
    readonly
    type="number"
    [(ngModel)]="currentEvenement.idEvenement"
    name="idEvenement"
    class="form-control">
</div>


    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Nom Événement</label>
      <input type="text"
             [(ngModel)]="currentEvenement.nomEvenement"
             name="nomEvenement"
             class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Lieu Événement</label>
      <input type="text"
             [(ngModel)]="currentEvenement.lieuEvenement"
             name="lieuEvenement"
             class="form-control">
    </div>

    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>Prix Événement</label>
      <input type="number"
             [(ngModel)]="currentEvenement.prixEvenement"
             name="prixEvenement"
             class="form-control">
    </div>

   
<div class="col-sm-4 col-md-4 col-lg-4">
  <label>Date de l'événement</label>
  <input
    type="date"
    [ngModel]="currentEvenement.dateEvenement | date:'yyyy-MM-dd'"
    (ngModelChange)="onDateChange($event)"
    name="dateEvenement"
    class="form-control">
</div>


    <div class="mt-2">
      <button type="button"
              (click)="updateEvenement()"
              class="btn btn-success">
        Modifier
      </button>
    </div>
  </form>
</div>
