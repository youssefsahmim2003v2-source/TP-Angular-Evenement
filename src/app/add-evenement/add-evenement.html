<div class="container">
    <div>
        <h2>Ajouter un événement :</h2>
    </div>

    <form>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>ID Événement</label>
            <input type="number" [(ngModel)]="newEvenement.idEvenement" name="idEvenement" class="form-control">
        </div>

        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Nom Événement</label>
            <input type="text" [(ngModel)]="newEvenement.nomEvenement" name="nomEvenement" class="form-control">
        </div>
        
<div class="form-group">
  <label>Lieu</label>
  <select
    class="form-control"
    name="idLieu"
    [(ngModel)]="newIdLieu"
  >
    @for (lieu of lieux; track lieu.idLieu) {
      <option [value]="lieu.idLieu">
        {{ lieu.nomLieu }}
      </option>
    }
  </select>
</div>


        

        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Prix Événement</label>
            <input type="number" [(ngModel)]="newEvenement.prixEvenement" name="prixEvenement" class="form-control">
        </div>


        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Date de l'événement</label>
            <input type="date" [(ngModel)]="newEvenement.dateEvenement" name="dateEvenement" class="form-control">
        </div>

        <div class="mt-2">
            <button type="submit" (click)="addEvenement()" class="btn btn-success">
                Ajouter
            </button>
        </div>
    </form>
</div>
